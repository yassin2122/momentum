name: grit
description: A premium gym workout tracking application.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^17.3.0

  # Backend / auth / storage
  supabase_flutter: ^2.18.0

  # In-progress workout persistence + offline retry queue; client-side ids
  # (both were already pulled in transitively by supabase_flutter)
  shared_preferences: ^2.5.6
  uuid: ^4.6.0

  # Charts (Dashboard/Statistics — wired now, used starting Phase 2)
  fl_chart: ^0.68.0

  # Animations
  flutter_animate: ^4.5.2

  # Icons
  # Image caching
  cached_network_image: ^3.4.1

  # Private progress photos (camera / library) for Analytics › Body
  image_picker: ^1.1.2

  cupertino_icons: ^1.0.8
  lucide_icons_flutter: ^3.1.15
  flutter_dotenv: ^6.0.1
  google_fonts: ^8.2.1
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/auth/
    - assets/images/hub/
    - assets/images/planets/
    - assets/images/phases/
    - assets/mascot/
    # Muscle-map anatomy (CC BY 4.0, see assets/anatomy/ATTRIBUTION.md)
    - assets/anatomy/body_front.svg
    - assets/anatomy/body_back.svg
