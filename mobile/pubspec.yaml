name: gym_app
description: A premium gym workout tracking application.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^17.3.0

  # Backend / auth / storage
  supabase_flutter: ^2.18.0

  # Charts (Dashboard/Statistics — wired now, used starting Phase 2)
  fl_chart: ^0.68.0

  # Animations
  flutter_animate: ^4.5.2

  # Icons
  # Image caching
  cached_network_image: ^3.4.1

  cupertino_icons: ^1.0.8
  lucide_icons_flutter: ^3.1.15
  flutter_dotenv: ^6.0.1
  google_fonts: ^8.2.1
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/auth/
